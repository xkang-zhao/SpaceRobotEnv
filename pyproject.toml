[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my_mujoco_spacerobot"
version = "0.2.0"
description = "MuJoCo spacerobot simulation package"
requires-python = ">=3.8"

[project.optional-dependencies]
warp = ["mujoco==3.12.0", "mujoco-warp==3.12.0", "warp-lang==1.17.0", "gymnasium>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]
